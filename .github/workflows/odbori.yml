name: Nova rešenja o odborima
on:
  schedule:
    # u 9, 13 i 17 h po beogradskom do nedelje (do 24. 10. letnje vreme UTC+2, 25. 10. zimsko UTC+1)
    - cron: "0 7,11,15 21-24 10 *"
    - cron: "0 8,12,16 25 10 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odbori
  cancel-in-progress: false
jobs:
  odbori:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Tesseract (srpski)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn >/dev/null
          python3 -m pip install -q --break-system-packages pypdfium2
      - run: |
          git config user.name "rik-odbori"; git config user.email "rik-odbori@users.noreply.github.com"
          python3 tools/odbori_novi.py | tee /tmp/out.txt
          THREADS=4 timeout 35m python3 tools/odbori_izmene.py > /tmp/izm.log 2>&1 || true
          ( date -u; tail -n 40 /tmp/izm.log ) > public/data/odbori_izm_log.txt
          git add public/data/odbori_*.json
          if ! git diff --cached --quiet; then
            git commit -qm "Rešenja o odborima: $(cat /tmp/out.txt)"
            for i in 1 2 3; do git push -q && break; git pull -q --rebase -X theirs; done
          fi
