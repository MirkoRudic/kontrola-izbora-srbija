name: Izborna noć – RIK uživo
on:
  schedule:
    # UTC: 25.10. 17:50–23:50 i 26.10. 00:00–06:50 (po beogradskom 19:50–08:50)
    - cron: "50 17 25 10 *"
    - cron: "*/10 18-23 25 10 *"
    - cron: "*/10 0-6 26 10 *"
  workflow_dispatch:
    inputs:
      sim:
        description: "Proba na rezultatima 2023 (true/false)"
        default: "false"
      reset:
        description: "Kreni od nule – obriši prethodne rezultate (true/false)"
        default: "false"
      tg_demo:
        description: "Samo pošalji probne Telegram poruke (true/false)"
        default: "false"
      minutes:
        description: "Koliko minuta da radi"
        default: "50"
permissions:
  contents: write
  actions: write
concurrency:
  group: rik-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 200 }
      - name: Prati RIK
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          git config user.name "rik-uzivo"; git config user.email "rik-uzivo@users.noreply.github.com"
          SIM=""; [ "${{ github.event.inputs.sim }}" = "true" ] && SIM="--sim"
          [ "${{ github.event.inputs.reset }}" = "true" ] && SIM="$SIM --reset"
          [ "${{ github.event.inputs.tg_demo }}" = "true" ] && SIM="--tg-demo"
          python3 tools/rik_live.py --minutes "${{ github.event.inputs.minutes || '50' }}" $SIM
      - name: Sledeći krug (ne čeka GitHub raspored)
        if: always() && github.event.inputs.sim != 'true' && github.event.inputs.tg_demo != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s); a=$(date -u -d 2026-10-25T17:40:00Z +%s); b=$(date -u -d 2026-10-26T05:00:00Z +%s)
          if [ $now -ge $a ] && [ $now -le $b ]; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/izborna-noc.yml/dispatches -f ref=main -f 'inputs[sim]=false' -f 'inputs[minutes]=55' && echo "pokrenut sledeći krug"
          else echo "van izborne noći – ne pokrećem dalje"; fi
