name: Izborna noć – RIK uživo
on:
  schedule:
    # UTC: 25.10. 17:50 do 28.10. 09:50 (po beogradskom 25.10. 19:50 do sreda 28.10. 11:50)
    - cron: "50 17 25 10 *"
    - cron: "*/10 18-23 25 10 *"
    - cron: "*/10 * 26-27 10 *"
    - cron: "*/10 0-9 28 10 *"
  workflow_dispatch:
    inputs:
      sim:
        description: "Proba na rezultatima 2023 (true/false)"
        default: "false"
      reset:
        description: "Kreni od nule – obriši prethodne rezultate (true/false)"
        default: "false"
      tg_demo:
        description: "Samo pošalji probne Telegram poruke (true/false)"
        default: "false"
      minutes:
        description: "Koliko minuta da radi"
        default: "50"
      proba_do:
        description: "Samo proba: lanac sim krugova do ovog UTC vremena (npr. 2026-10-24T05:00:00Z); prazno = bez lanca"
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: rik-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 200 }
      - name: Prati RIK
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          git config user.name "rik-uzivo"; git config user.email "rik-uzivo@users.noreply.github.com"
          SIM=""; [ "${{ github.event.inputs.sim }}" = "true" ] && SIM="--sim"
          [ "${{ github.event.inputs.reset }}" = "true" ] && SIM="$SIM --reset"
          [ "${{ github.event.inputs.tg_demo }}" = "true" ] && SIM="--tg-demo"
          python3 tools/rik_live.py --threads 40 --minutes "${{ github.event.inputs.minutes || '50' }}" $SIM
      - name: Sledeći krug (ne čeka GitHub raspored)
        if: always() && github.event.inputs.sim != 'true' && github.event.inputs.tg_demo != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s); a=$(date -u -d 2026-10-25T17:40:00Z +%s); b=$(date -u -d 2026-10-28T09:50:00Z +%s)
          if [ $now -ge $a ] && [ $now -le $b ]; then
            if gh api -X POST repos/${{ github.repository }}/actions/workflows/izborna-noc.yml/dispatches -f ref=main -f 'inputs[sim]=false' -f 'inputs[minutes]=55'; then M="pokrenut sledeći krug"; else M="GREŠKA: sledeći krug NIJE pokrenut"; fi
          else M="van izborne noći – ne pokrećem dalje"; fi
          echo "$M"; echo "radni tok izborna noć (${{ github.event_name }}): $M" | python3 tools/dnevnik.py izborna-noc || true
      - name: Sledeći krug probe (lanac kao u izbornoj noći)
        if: always() && github.event.inputs.sim == 'true' && github.event.inputs.proba_do != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s); b=$(date -u -d "${{ github.event.inputs.proba_do }}" +%s)
          if [ $now -le $b ]; then
            if gh api -X POST repos/${{ github.repository }}/actions/workflows/izborna-noc.yml/dispatches -f ref=main -f 'inputs[sim]=true' -f 'inputs[minutes]=55' -f "inputs[proba_do]=${{ github.event.inputs.proba_do }}"; then M="proba: pokrenut sledeći krug"; else M="GREŠKA: proba – sledeći krug NIJE pokrenut"; fi
          else M="proba: kraj lanca (${{ github.event.inputs.proba_do }})"; fi
          echo "$M"; echo "radni tok izborna noć (proba): $M" | python3 tools/dnevnik.py izborna-noc || true
