name: RIK test
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/rik-test.yml","tools/rik_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          { date -u; curl -s https://ipinfo.io/json; echo; python3 tools/rik_probe.py 2>&1; } > probe/github.txt || true
          cat probe/github.txt
          git config user.name "rik-probe"; git config user.email "rik-probe@users.noreply.github.com"
          git add probe && git commit -m "RIK test sa GitHub servera" && git push
